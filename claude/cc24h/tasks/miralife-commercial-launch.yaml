        prompt: |
          项目：C:/Users/86136/Desktop/miralife
          任务：制作一份 Beta 邀请素材包，让创始人能在 10 分钟内开始拉人。

          创建 docs/beta-invite-kit.md，包含：

          1. 朋友圈文案（3 个版本，直接复制粘贴）：
             - 版本A（好奇型）："做了个东西，把 MBTI + 八字 + 塔罗三面镜子合在一起看你是谁。前 20 个人免费深度报告。链接：xxx"
             - 版本B（挑战型）："你敢不敢用三面镜子照自己？MBTI告诉你性格，八字告诉你命盘，塔罗告诉你潜意识。合在一起看会怎样？"
             - 版本C（送礼型）："做了个生日礼物神器——输入生日就能生成专属八维人格图。想试的评论区留言，限 20 人。"

             文案规则：
             - 用"你"开头或直接提问
             - 15字以内的标题/第一句
             - 给悬念，不给答案
             - 禁止：AI驱动、智能洞察、一站式

          2. 小红书帖子文案（2 个版本）：
             - 标题要带 MBTI/八字/塔罗 关键词（搜索流量）
             - 正文讲自己测试的过程和惊讶的发现
             - 结尾引导私信获取链接

          3. 微信群发消息（1 个版本）：
             - 发给10个最可能感兴趣的朋友
             - 简短，直接，附链接

          4. 目标用户画像 checklist：
             - 22-30岁女性
             - 发过 MBTI 相关内容
             - 对星座/玄学有兴趣
             - 在小红书/微博活跃
             - 优先找身边已知的这类朋友

          5. 反馈收集模板（微信对话用）：
             - "做完了吗？做了几个引擎？"
             - "八维图看懂了吗？哪个维度最准？"
             - "有没有哪里觉得不对劲或者卡住？"
             - "如果这个报告卖 9.9 你会买吗？为什么？"
             - "你会分享给朋友吗？为什么会/不会？"

