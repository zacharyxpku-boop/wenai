      - id: hepan-free-unlock
        name: "合盘功能免费开放（去掉 waitlist 门槛）"
        priority: P1
        role: 快刀官
        level: L2
        files_touched:
          - src/app/engines/hepan/ (MODIFY)
          - src/app/pricing/page.tsx (MODIFY)
        prompt: |
          项目：C:/Users/86136/Desktop/miralife
          任务：把合盘（Hepan）从 ¥19.9 waitlist 改为免费开放。

          原因：合盘是最强裂变武器（用户天然想和朋友/伴侣比较）。
          把它锁在付费后面 = 杀死裂变。赚钱靠 ¥9.9 报告，不靠合盘。

          执行：
          1. 在 src/app/pricing/page.tsx 中：
             - 找到 SINGLE_PRODUCTS 中的 "双人合盘报告" (price: "¥19.9", active: false)
             - 删除这个付费项，或标记为 "free"

          2. 在合盘相关页面中：
             - 找到所有 waitlist / paywall 门槛
             - 移除付费检查，让用户可以直接使用合盘功能
             - 保留分享机制（这是裂变的核心）

          3. 在合盘结果页：
             - 确保有醒目的分享按钮
             - 确保分享链接的接收者不需要登录就能查看结果
             - 在合盘结果页底部加一个 CTA：
               "想更深入了解你们的关系？试试深度报告 ¥9.9"
               链接到 /pricing 或 /report/sample

          约束：
          - 不改合盘的计算逻辑和 AI 叙事
          - 只改访问控制和 CTA 指向
          - 合盘结果页的分享功能要正常工作

  - name: "Wave 4: 20人验证 (Day 4-7)"
    tasks:
