  - name: "Wave 2: 数据持久化 (Day 2-3)"
    tasks:
      - id: supabase-engine-results-persist
        name: "engine_results 从 localStorage-first 升级为 Supabase-first"
        priority: P0
        role: 快刀官
        level: L3
        files_touched:
          - src/lib/stores/engine-results.ts (MODIFY)
          - src/lib/stores/profile-snapshot.ts (MODIFY if exists)
          - src/app/engines/mbti/result/page.tsx (MODIFY)
          - src/app/engines/bazi/result/page.tsx (MODIFY)
          - src/app/engines/tarot/result/page.tsx (MODIFY)
          - supabase/migrations/006_anonymous_engine_results.sql (NEW)
        prompt: |
          项目：C:/Users/86136/Desktop/miralife
          任务：让 engine_results 在未登录状态下也能持久化到 Supabase，不再仅依赖 localStorage。

          现状：
          - src/lib/stores/engine-results.ts 有 saveEngineResult() 和 syncToRemote()
          - syncToRemote() 只在用户登录后才同步到 Supabase（if (!user) return）
          - 未登录用户（绝大多数）的数据只在 localStorage，清缓存就没了
          - Supabase schema 的 engine_results 表要求 user_id（UUID, refs profiles）

          解决方案：用 visitor_id 实现匿名持久化

          1. 创建新 migration supabase/migrations/006_anonymous_engine_results.sql：
             ```sql
             -- 允许匿名存储 engine results
             ALTER TABLE engine_results ALTER COLUMN user_id DROP NOT NULL;
             ALTER TABLE engine_results ADD COLUMN visitor_id TEXT;

             -- 新的唯一约束：visitor_id + engine_type（匿名用户）
             CREATE UNIQUE INDEX idx_engine_results_visitor_engine
               ON engine_results(visitor_id, engine_type)
               WHERE visitor_id IS NOT NULL AND user_id IS NULL;

             -- RLS：匿名用户可以 insert/select by visitor_id
             CREATE POLICY "anon_insert_engine_results" ON engine_results
               FOR INSERT TO anon WITH CHECK (visitor_id IS NOT NULL);

             CREATE POLICY "anon_select_engine_results" ON engine_results
               FOR SELECT TO anon USING (visitor_id = current_setting('request.headers')::json->>'x-visitor-id');
             ```

             注意：RLS 对匿名读取可能需要用 service role 或者 custom header。
             更简单的方案：创建一个 /api/engine-results API route 用 service role 读写。

          2. 创建 src/app/api/engine-results/route.ts：
             - GET: 接收 ?visitorId=xxx，用 service role 查询 engine_results WHERE visitor_id = visitorId
             - POST: 接收 { visitorId, engineType, resultData }，用 service role upsert
             - 这样绕过 RLS 复杂性，前端只需要 fetch API

          3. 修改 src/lib/stores/engine-results.ts：

             saveEngineResult() 改为：
             ```typescript
             export async function saveEngineResult(engine: string, result: any): void {
               // 1. 始终存 localStorage（离线备份）
               const existing = getLocalResults()
               existing[engine] = { ...result, savedAt: new Date().toISOString() }
               localStorage.setItem(RESULTS_KEY, JSON.stringify(existing))

               // 2. 同步到远程（不阻塞）
               syncToRemote(engine, result).catch(console.warn)
             }
             ```

             syncToRemote() 改为：
             ```typescript
             async function syncToRemote(engine: string, result: unknown): Promise<void> {
               // 优先用 user_id（已登录），否则用 visitor_id（匿名）
               const supabase = getSupabaseBrowserClient()
               const user = supabase ? (await supabase.auth.getUser()).data.user : null
               const visitorId = getOrCreateVisitorId()

               if (user) {
                 // 已登录：直接用 Supabase client（有 RLS）
                 await supabase.from("engine_results").upsert({
                   user_id: user.id,
                   engine_type: engine,
                   result_data: result,
                   engine_version: "0.1.0"
                 }, { onConflict: "user_id,engine_type" })
               } else if (visitorId) {
                 // 未登录：走 API route（用 service role）
                 await fetch("/api/engine-results", {
                   method: "POST",
                   headers: { "Content-Type": "application/json" },
                   body: JSON.stringify({ visitorId, engineType: engine, resultData: result })
                 })
               }
             }
             ```

          4. 新增 loadEngineResults() 恢复函数：
             ```typescript
             export async function loadEngineResults(): Promise<Record<string, any>> {
               // 1. 先读 localStorage
               const local = getLocalResults()

               // 2. 尝试从远程恢复
               const visitorId = getOrCreateVisitorId()
               if (!visitorId) return local

               try {
                 const res = await fetch(`/api/engine-results?visitorId=${visitorId}`)
                 if (!res.ok) return local
                 const remote = await res.json()

                 // 3. 合并：remote 优先（因为可能在另一台设备上做的）
                 const merged = { ...local }
                 for (const row of remote) {
                   if (!merged[row.engine_type] ||
                       new Date(row.updated_at) > new Date(merged[row.engine_type].savedAt || 0)) {
                     merged[row.engine_type] = row.result_data
                   }
                 }

                 // 4. 回写 localStorage
                 localStorage.setItem(RESULTS_KEY, JSON.stringify(merged))
                 return merged
               } catch {
                 return local
               }
             }
             ```

          5. 在 Profile 页面（src/app/profile/page.tsx）加载时调用 loadEngineResults()
             确保用户换设备或清缓存后，数据能从 Supabase 恢复。

          关键约束：
          - localStorage 仍然是第一写入层（保证离线可用）
          - Supabase 同步是 fire-and-forget（不阻塞 UI）
          - visitor_id 已经存在于 src/lib/analytics/visitor-id.ts，直接复用
          - 不改 engine 计算逻辑，只改存储层
          - 如果 Supabase 未配置，行为和现在完全一样（只存 localStorage）

      - id: login-merge-visitor
        name: "用户登录后合并 visitor_id 数据"
        priority: P1
        role: 快刀官
        level: L2
        depends_on: [supabase-engine-results-persist]
        files_touched:
          - src/lib/auth/auth-context.tsx (MODIFY)
          - src/app/api/engine-results/merge/route.ts (NEW)
        prompt: |
          项目：C:/Users/86136/Desktop/miralife
          任务：用户登录后，把 visitor_id 下的 engine_results 合并到 user_id 下。

          场景：用户先匿名做了3个引擎 → 后来注册登录 → 之前的数据要自动归属到她的账号。

          1. 创建 src/app/api/engine-results/merge/route.ts：
             - POST { visitorId: string }
             - 用 service role 查询 engine_results WHERE visitor_id = visitorId AND user_id IS NULL
             - 对每条记录：UPDATE SET user_id = 当前用户ID, visitor_id = NULL
             - 冲突处理：如果 user_id + engine_type 已存在，保留较新的那条

          2. 在 src/lib/auth/auth-context.tsx 的 onAuthStateChange 回调中：
             - 当 event === "SIGNED_IN" 时
             - 读取 localStorage 的 visitor_id
             - 调用 POST /api/engine-results/merge { visitorId }
             - 这样用户登录后，之前匿名做的测试自动归到她名下

          约束：
          - 合并是一次性操作，不需要反复执行
          - 失败不影响用户体验（数据仍在 localStorage）
          - 不改登录流程本身

