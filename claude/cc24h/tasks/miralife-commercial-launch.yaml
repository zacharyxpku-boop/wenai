          执行步骤：

          1. 安装 stripe 包：
             npm install stripe @stripe/stripe-js

          2. 创建 src/lib/payment/stripe.ts：
             - 导出 getStripeServer(): Stripe (server-side, 用 STRIPE_SECRET_KEY)
             - 导出 getStripePromise(): Promise<Stripe> (client-side, 用 NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY)
