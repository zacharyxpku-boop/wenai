id: yaml-planner
name: YAML Planner
purpose: >-
  Generate and optimize execution-plan.yaml with dependency graphs, parallel safety, conflict detection, and risk
  assessment
category: planning
risk_level: L2
scope: []
owner: system
version: 1.0.0
status: approved
allowed_tools:
  - Read
  - Glob
  - Grep
  - Write(tasks/*.yaml)
  - Bash(git log)
forbidden_zones:
  - auth
  - payment
  - migration
  - secrets
  - deploy
  - database-schema
  - ci-cd
validation_checks:
  - YAML valid
  - DAG has no cycles
  - every parallel_safe:false has reason
  - files_touched verified via Glob
rollback_strategy: ''
test_command: ''
applicable_when: After task-decomposition, when refining a plan, or when optimizing parallel strategy
not_applicable_when: Plan already finalized and approved
adoption_score: 0
use_count: 0
success_count: 0
fail_count: 0
